name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF needs the Windows desktop SDK.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build MmaManager.sln -c Release -v q --nologo
      - name: Test
        run: dotnet test MmaManager.sln -c Release --no-build -v q --nologo
      - name: Build longsim
        run: dotnet build tools/longsim/longsim.csproj -c Release -v q --nologo
